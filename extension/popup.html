<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AE Cookies</title>
  </head>
  <body
    style="
      width: 320px;
      padding: 16px;
      font-family: sans-serif;
      text-align: center;
    "
  >
    <h2 style="margin: 0 0 8px">AE Cookie Extractor</h2>
    <p style="font-size: 13px; color: #666; margin: 0 0 12px">
      Make sure you're logged in at aliexpress.com
    </p>
    <button
      id="copyBtn"
      style="
        width: 100%;
        padding: 10px;
        background: #ff6a00;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      "
    >
      Copy All Cookies
    </button>
    <p id="status" style="font-size: 12px; margin-top: 10px; color: #999"></p>
    <script src="popup.js"></script>
  </body>
</html>
